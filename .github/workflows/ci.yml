name: 🤖 QA AI Framework Python — CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *'   # Nightly at 2am UTC

env:
  PYTHON_VERSION: '3.11'
  BASE_URL: ${{ vars.BASE_URL || 'http://localhost:3000' }}

jobs:

  # ══════════════════════════════════════════════════════════════════
  # JOB 1 — Lint & Type Check
  # ══════════════════════════════════════════════════════════════════
  lint:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install ruff mypy

      - name: Ruff lint
        run: ruff check src/ tests/ scripts/

      - name: Ruff format check
        run: ruff format --check src/ tests/ scripts/

  # ══════════════════════════════════════════════════════════════════
  # JOB 2 — API Tests (fast, no browser)
  # ══════════════════════════════════════════════════════════════════
  api-tests:
    name: 🌐 API Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run API tests
        run: |
          mkdir -p reports
          pytest tests/api/ -m api \
            --json-report --json-report-file=reports/api-results.json \
            --html=reports/api-report.html \
            -v
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}

      - name: Upload API results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: reports/

  # ══════════════════════════════════════════════════════════════════
  # JOB 3 — E2E Tests (matrix: chromium × firefox × webkit)
  # ══════════════════════════════════════════════════════════════════
  e2e-tests:
    name: 🖥️ E2E — ${{ matrix.browser }}
    runs-on: ubuntu-latest
    needs: api-tests
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright + browsers
        run: |
          playwright install ${{ matrix.browser }}
          playwright install-deps ${{ matrix.browser }}

      - name: Run E2E tests — ${{ matrix.browser }}
        run: |
          mkdir -p reports
          pytest tests/specs/ \
            --browser ${{ matrix.browser }} \
            --json-report --json-report-file=reports/e2e-${{ matrix.browser }}.json \
            --html=reports/e2e-${{ matrix.browser }}.html \
            -v
        env:
          BASE_URL:           ${{ env.BASE_URL }}
          HEADLESS:           "true"
          TEST_USER_EMAIL:    ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Upload E2E results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-${{ matrix.browser }}
          path: reports/

  # ══════════════════════════════════════════════════════════════════
  # JOB 4 — Quality Gate (≥ 90% pass rate)
  # ══════════════════════════════════════════════════════════════════
  quality-gate:
    name: ✅ Quality Gate
    runs-on: ubuntu-latest
    needs: [api-tests, e2e-tests]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          pattern: '*-results*'
          merge-multiple: true
          path: all-reports/

      - name: Evaluate Quality Gate
        run: |
          python - <<'EOF'
          import json, sys, glob, os

          passed = failed = total = 0
          for path in glob.glob("all-reports/**/*.json", recursive=True):
              try:
                  data = json.loads(open(path).read())
                  for test in data.get("tests", []):
                      total += 1
                      if test.get("outcome") == "passed":
                          passed += 1
                      else:
                          failed += 1
              except Exception as e:
                  print(f"Warning: could not parse {path}: {e}")

          if total == 0:
              print("⚠️  No results found")
              sys.exit(1)

          rate = round(passed * 100 / total, 1)
          print(f"══════════════════════════════════")
          print(f"  Quality Gate Results")
          print(f"══════════════════════════════════")
          print(f"  Total   : {total}")
          print(f"  Passed  : {passed}")
          print(f"  Failed  : {failed}")
          print(f"  Rate    : {rate}%")
          print(f"══════════════════════════════════")

          if rate < 90:
              print(f"\n❌ Quality Gate FAILED — {rate}% < 90%")
              sys.exit(1)
          print(f"\n✅ Quality Gate PASSED — {rate}% ≥ 90%")
          EOF

  # ══════════════════════════════════════════════════════════════════
  # JOB 5 — AI Failure Analysis (only when tests fail)
  # ══════════════════════════════════════════════════════════════════
  ai-analysis:
    name: 🤖 AI Failure Analysis
    runs-on: ubuntu-latest
    needs: [api-tests, e2e-tests]
    if: failure()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          pattern: '*-results*'
          merge-multiple: true
          path: reports/

      - name: Merge JSON results
        run: |
          python - <<'EOF'
          import json, glob

          all_tests = []
          for path in glob.glob("reports/**/*.json", recursive=True):
              try:
                  data = json.loads(open(path).read())
                  all_tests.extend(data.get("tests", []))
              except Exception:
                  pass

          merged = {"tests": all_tests}
          open("reports/results.json", "w").write(json.dumps(merged, indent=2))
          print(f"Merged {len(all_tests)} test results")
          EOF

      - name: Run AI failure analysis
        run: python scripts/analyze_failures.py --results reports/results.json --output reports/analysis.md
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload AI analysis
        uses: actions/upload-artifact@v4
        with:
          name: ai-failure-analysis
          path: reports/analysis.md

      - name: Post analysis to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const path = 'reports/analysis.md'
            if (!fs.existsSync(path)) return
            const content = fs.readFileSync(path, 'utf8').substring(0, 2000)
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🤖 AI Failure Analysis\n\n${content}\n\n_[Full report in CI artifacts]_`
            })

  # ══════════════════════════════════════════════════════════════════
  # JOB 6 — Publish HTML report to GitHub Pages
  # ══════════════════════════════════════════════════════════════════
  publish-report:
    name: 📊 Publish Report
    runs-on: ubuntu-latest
    needs: quality-gate
    if: github.ref == 'refs/heads/main' && always()
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Download chromium report
        uses: actions/download-artifact@v4
        with:
          name: e2e-results-chromium
          path: gh-pages/

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages/
      - uses: actions/deploy-pages@v4
